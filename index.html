                    {PROGRAMMING_LANGUAGES.map((lang) => {
                      const isSelected = quizSelectedLang === lang.name;
                      return (
                        <button key={lang.id} type="button" onClick={() => setQuizSelectedLang(lang.name)} className={`p-4 rounded-2xl border text-left transition-all flex flex-col justify-between gap-2 ${isSelected ? 'border-cyan-400 bg-cyan-500/15 shadow-lg scale-[1.02]' : 'border-white/10 bg-black/30 hover:border-white/25 text-slate-300'}`}>
                          <div className="flex items-center justify-between"><span className="font-bold text-sm text-white">{lang.name}</span><span className="text-[10px] font-mono px-2 py-0.5 rounded bg-white/10 text-cyan-300">.{lang.ext}</span></div>
                          <div className="text-[11px] text-slate-400 truncate">{lang.ecosystem.slice(0, 2).join(' • ')}</div>
                        </button>
                      );
                    })}
                  </div>
                  <div className="pt-4 border-t border-white/10 flex flex-wrap items-center justify-between gap-4">
                    <div className="text-xs text-slate-400 font-mono">Selected Quiz Language: <strong className={quizSelectedLang ? 'text-emerald-300' : 'text-amber-300'}>{quizSelectedLang || 'None Selected Yet'}</strong></div>
                    <button type="button" disabled={!quizSelectedLang} onClick={() => { if (!quizSelectedLang) return; setQuizAnswers({}); setCurrentQuestionIdx(0); setQuizStage('questions'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="px-7 py-3.5 rounded-2xl text-xs sm:text-sm font-black text-slate-950 shadow-xl flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed transition" style={{ backgroundImage: 'linear-gradient(90deg, #00FFFF 0%, #00E5C0 50%, #10D582 100%)' }}>
                      <span>{quizSelectedLang ? `Start ${quizSelectedLang} Diagnostic` : 'Select a Language to Unlock Quiz'}</span><ArrowRight className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              )}

              {quizStage === 'questions' && (
                <div className="space-y-6">
                  <div className="rounded-2xl border border-white/10 p-5 flex flex-wrap items-center justify-between gap-4" style={{ backgroundColor: '#15171A' }}>
                    <div><div className="text-xs font-mono text-cyan-300 uppercase">STAGE 2 OF 3 • {quizSelectedLang.toUpperCase()} DIAGNOSTIC</div><h2 className="text-lg font-bold text-white mt-0.5">Question {currentQuestionIdx + 1} of {activeQuizQuestions.length} • Answered: {Object.keys(quizAnswers).length}/{activeQuizQuestions.length}</h2></div>
                    <button type="button" onClick={() => setQuizStage('select-language')} className="px-3.5 py-2 rounded-xl text-xs font-semibold bg-white/5 hover:bg-white/10 text-slate-300 border border-white/10">Change Language ({quizSelectedLang})</button>
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {activeQuizQuestions.map((q, idx) => {
                      const isCurrent = idx === currentQuestionIdx;
                      const isAnswered = quizAnswers[q.id] !== undefined;
                      return (
                        <button key={q.id} type="button" onClick={() => setCurrentQuestionIdx(idx)} className={`w-9 h-9 rounded-xl font-mono text-xs font-bold transition ${isCurrent ? 'text-slate-950 shadow-md scale-105' : isAnswered ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-400/40' : 'bg-[#15171A] text-slate-400 border border-white/10 hover:text-white'}`} style={isCurrent ? { backgroundImage: 'linear-gradient(90deg, #00FFFF 0%, #10D582 100%)' } : {}}>{idx + 1}</button>
                      );
                    })}
                  </div>
                  {(() => {
                    const q = activeQuizQuestions[currentQuestionIdx];
                    return (
                      <div className="rounded-3xl border border-white/10 overflow-hidden shadow-2xl" style={{ backgroundColor: '#15171A' }}>
                        <div className="px-6 py-4 border-b border-white/10 bg-black/40 flex flex-wrap items-center justify-between gap-2">
                          <div className="flex items-center gap-2"><span className="px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-cyan-500/15 text-cyan-300 border border-cyan-400/30">Scenario #{currentQuestionIdx + 1}: {q.category}</span></div>
                          <span className="text-xs font-mono text-slate-400">Blind Assessment Mode</span>
                        </div>
                        <div className="p-6 space-y-5">
                          <h3 className="text-base sm:text-lg font-bold text-white">{q.title}</h3>
                          <div className="rounded-2xl border border-white/10 overflow-hidden bg-[#0E1013]">
                            <div className="px-4 py-2 border-b border-white/10 bg-black/50 flex items-center justify-between text-[11px] font-mono text-slate-400"><span>production_snippet_{q.id}.{PROGRAMMING_LANGUAGES.find(l => l.name === quizSelectedLang)?.ext || 'txt'}</span></div>
                            <pre className="p-4 font-mono text-xs sm:text-sm text-cyan-100 overflow-x-auto leading-relaxed">{q.codeSnippet}</pre>
                          </div>
                          <div className="text-sm sm:text-base font-bold text-white pt-1">{q.question}</div>
                          <div className="space-y-2.5">
                            {q.options.map((opt, oIdx) => {
                              const isSelected = quizAnswers[q.id] === oIdx;
                              return (
                                <button key={oIdx} type="button" onClick={() => setQuizAnswers((prev) => ({ ...prev, [q.id]: oIdx }))} className={`w-full p-4 rounded-2xl border text-left text-xs sm:text-sm transition flex items-center justify-between gap-3 ${isSelected ? 'border-cyan-400 bg-cyan-500/15 text-white font-semibold shadow-md' : 'border-white/10 bg-black/30 text-slate-300 hover:border-white/25'}`}>
                                  <div className="flex items-start gap-3"><span className={`w-6 h-6 rounded-lg font-mono text-xs font-bold flex items-center justify-center shrink-0 mt-0.5 ${isSelected ? 'bg-cyan-400 text-slate-950' : 'bg-white/10 text-slate-400'}`}>{String.fromCharCode(65 + oIdx)}</span><span>{opt.text}</span></div>
                                </button>
                              );
                            })}
                          </div>
                          <div className="pt-5 border-t border-white/10 flex flex-wrap items-center justify-between gap-3">
                            <button type="button" disabled={currentQuestionIdx === 0} onClick={() => setCurrentQuestionIdx((p) => Math.max(0, p - 1))} className="px-4 py-2.5 rounded-xl text-xs font-bold bg-white/5 text-slate-300 hover:bg-white/10 disabled:opacity-40">← Previous</button>
                            <div className="flex items-center gap-3">
                              {currentQuestionIdx < activeQuizQuestions.length - 1 ? (
                                <button type="button" onClick={() => setCurrentQuestionIdx((p) => Math.min(activeQuizQuestions.length - 1, p + 1))} className="px-5 py-2.5 rounded-xl text-xs font-bold text-slate-950" style={{ backgroundImage: 'linear-gradient(90deg, #00FFFF 0%, #10D582 100%)' }}>Next Question →</button>
                              ) : null}
                              <button type="button" onClick={handleSubmitCodeDiagnostic} className="px-6 py-2.5 rounded-xl text-xs font-black text-slate-950 shadow-lg" style={{ backgroundImage: 'linear-gradient(90deg, #00FFFF 0%, #00E5C0 50%, #10D582 100%)' }}>Submit Answers</button>
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })()}
                </div>
              )}

              {quizStage === 'results' && (
                <div className="space-y-8">
                  <div className="rounded-3xl border border-emerald-400/50 p-6 sm:p-8 space-y-6 shadow-2xl" style={{ backgroundColor: '#15171A' }}>
                    <div className="flex flex-wrap items-center justify-between gap-4 border-b border-white/10 pb-5">
                      <div>
                        <div className="text-xs font-mono text-emerald-300 uppercase">STAGE 3 OF 3 • {quizSelectedLang.toUpperCase()} DIAGNOSTIC REPORT COMPLETE</div>
                        <h2 className="text-2xl sm:text-3xl font-black text-white mt-1">Readiness: {quizSummary.pct}% ({quizSummary.correctCount}/{quizSummary.total} Correct)</h2>
                        <p className="text-xs sm:text-sm text-slate-300 mt-1">Primary Identified Bottleneck: <strong className="text-amber-300">{quizSummary.primaryWeakness}</strong></p>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        <button type="button" onClick={() => { setQuizAnswers({}); setCurrentQuestionIdx(0); setQuizStage('select-language'); }} className="px-4 py-2.5 rounded-xl text-xs font-bold bg-white/10 text-white hover:bg-white/15">Retake / Change Language</button>
                      </div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
                      {Object.entries(quizSummary.categoryStats).map(([cat, st]) => {
                        const catPct = Math.round((st.correct / st.total) * 100);
                        return (
                          <div key={cat} className="p-4 rounded-2xl bg-black/40 border border-white/10 space-y-2">
                            <div className="flex items-center justify-between text-xs"><span className="font-bold text-white">{cat}</span><span className={`font-mono font-bold ${catPct === 100 ? 'text-emerald-400' : catPct >= 50 ? 'text-amber-300' : 'text-rose-400'}`}>{st.correct}/{st.total} ({catPct}%)</span></div>
                            <div className="w-full h-2 rounded-full bg-white/10 overflow-hidden"><div className="h-full rounded-full" style={{ width: `${catPct}%`, backgroundImage: 'linear-gradient(90deg, #00FFFF 0%, #10D582 100%)' }} /></div>
                          </div>
                        );
                      })}
                    </div>
                    <div className="space-y-4 pt-2">
                      <div>
                        <h3 className="text-lg font-extrabold text-white flex items-center gap-2"><Sparkles className="w-5 h-5 text-cyan-400" />Recommended {quizSelectedLang} Production Projects to Fix Your Weaknesses</h3>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {quizSummary.recommendedProjects.map((proj) => (
                          <div key={proj.id} className="p-5 rounded-2xl bg-black/40 border border-cyan-400/30 flex flex-col justify-between gap-4">
                            <div className="space-y-1.5"><div className="flex items-center justify-between text-[11px] font-mono"><span className="text-cyan-300">{proj.hubName}</span><span className="text-emerald-300">{proj.languages.join(' + ')}</span></div><div className="text-base font-bold text-white">{proj.title}</div><div className="text-xs text-slate-400">{proj.subtitle}</div><div className="text-[11px] font-mono text-amber-300 pt-1">Target Skill: {proj.focus} ({proj.bigOLegacy} → {proj.bigOSolution})</div></div>
                            <div className="grid grid-cols-2 gap-2.5 pt-2 border-t border-white/10">
                              <button type="button" onClick={() => handleOpenProject(proj, 'refactor')} className="py-2.5 rounded-xl text-xs font-bold text-slate-950 flex items-center justify-center gap-1.5" style={{ backgroundImage: 'linear-gradient(90deg, #00FFFF 0%, #10D582 100%)' }}><Terminal className="w-3.5 h-3.5" /> View Project</button>
                              <button type="button" onClick={() => handleOpenProject(proj, 'solution')} className="py-2.5 rounded-xl text-xs font-bold border border-emerald-400/40 bg-emerald-500/10 text-emerald-300 flex items-center justify-center gap-1.5"><FileCode className="w-3.5 h-3.5" /> Get Solution</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                  {quizSummary.missedQuestions.length > 0 && (
                    <div className="rounded-3xl border border-white/10 p-6 space-y-4" style={{ backgroundColor: '#15171A' }}>
                      <div className="flex items-center justify-between"><h3 className="text-base font-bold text-white">Post-Mortem of Missed Code Output Scenarios ({quizSummary.missedQuestions.length})</h3><button type="button" onClick={() => setShowMissedCodeReview((p) => !p)} className="text-xs font-mono text-cyan-300 underline">{showMissedCodeReview ? 'Hide Explanations' : 'Show Explanations'}</button></div>
                      {showMissedCodeReview && (
                        <div className="space-y-4">
                          {quizSummary.missedQuestions.map((mq) => (
                            <div key={mq.id} className="p-4 rounded-2xl bg-black/35 border border-white/10 space-y-3 text-xs">
                              <div className="flex items-center justify-between font-mono text-cyan-300"><span>{mq.title} ({mq.category})</span><span className="text-rose-300">{mq.weaknessTag}</span></div>
                              <pre className="p-3 rounded-xl bg-[#0D0F12] border border-white/5 font-mono text-[11px] text-slate-300 overflow-x-auto">{mq.codeSnippet}</pre>
                              <div className="text-rose-300"><strong>Your Prediction:</strong> {mq.userSelectedText}</div>
                              <div className="text-emerald-300"><strong>Actual Output:</strong> {mq.correctText}</div>
                              <div className="text-slate-300 bg-white/5 p-3 rounded-xl"><strong>Root Cause:</strong> {mq.explanation}</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}
            </main>
          )}

          {activeNav === 'architecture' && (
            <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-8">
              <div className="rounded-3xl border border-white/10 p-6 sm:p-8" style={{ backgroundColor: '#15171A' }}>
                <h1 className="text-2xl sm:text-3xl font-black text-white">The 7 "Production Chaos" Engines Powering BeyondSyntax</h1>
                <p className="text-xs sm:text-sm text-slate-400 mt-1">Academic environments teach students to write code from scratch in a vacuum; BeyondSyntax simulates the chaos, collaboration, and constraints of actual production environments.</p>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {[
                  { num: '01', title: 'The "Legacy Code" Refactoring Engine', gap: 'Students rarely read other people’s code; they only build greenfield scripts.', feature: 'Workbenches pre-loaded with undocumented O(n²) legacy code. Refactor complexity and pass edge-case unit tests.', tab: 'refactor' },
                  { num: '02', title: 'Production API Sandbox', gap: 'University projects use clean local JSON or 100%-uptime mock APIs.', feature: 'Simulates HTTP 429 rate limiting, 500 server timeouts, missing JSON payload fields, and cursor pagination.', tab: 'api-sandbox' },
                  { num: '03', title: 'Client Ambiguity Simulator (Agile)', gap: 'Assignments have static PDF rubrics and fixed deadlines.', feature: 'Triggers mid-sprint Slack/Jira "Client Update" popups forcing engineers to adapt to shifting requirements on the fly.', tab: 'refactor' },
                  { num: '04', title: '"Production-Ready" DB Migration Workbench', gap: 'Students write CREATE TABLE once and never migrate live data.', feature: 'Pre-populated with 100,000 user rows. Write zero-downtime ALTER TABLE migrations without DROP TABLE.', tab: 'db-migration' },
                  { num: '05', title: 'CI/CD Pipeline Simulator', gap: 'If code runs on the student’s laptop, it is considered finished.', feature: 'Visual 4-stage deployment pipeline with terminal failure logs checking Big-O regression and hardcoded secrets.', tab: 'cicd' },
                  { num: '06', title: 'AI "Senior Developer" Code Reviews', gap: 'Professors grade solely on whether output matches expected text.', feature: 'LLM Staff Engineer reviews your PR for naming conventions, SQLi vulnerabilities, DRY modularity, and efficiency.', tab: 'ai-review' },
                  { num: '07', title: 'Environment Configuration Challenges', gap: 'Everything is pre-configured by the instructor beforehand.', feature: 'Interactive .env & lockfile conflict resolver requiring exact version pinning.', tab: 'env-config' }
                ].map((item) => (
                  <div key={item.num} className="rounded-2xl border border-white/10 p-6 flex flex-col justify-between space-y-4" style={{ backgroundColor: '#15171A' }}>
                    <div className="space-y-2.5">
                      <span className="text-2xl font-black font-mono bg-clip-text text-transparent" style={{ backgroundImage: 'linear-gradient(90deg, #00FFFF 0%, #10D582 100%)' }}>#{item.num}</span>
                      <h3 className="text-lg font-bold text-white">{item.title}</h3>
                      <p className="text-xs text-rose-300/90 bg-rose-950/20 p-2.5 rounded-xl border border-rose-500/20"><strong>The Academic Gap:</strong> {item.gap}</p>
                      <p className="text-xs text-slate-300 leading-relaxed"><strong>The BeyondSyntax Workbench:</strong> {item.feature}</p>
                    </div>
                    <button onClick={() => { setWorkbenchTab(item.tab); setActiveNav('workbench'); }} className="w-full py-2.5 rounded-xl text-xs font-bold text-slate-950" style={{ backgroundImage: 'linear-gradient(90deg, #00FFFF 0%, #00E5C0 50%, #10D582 100%)' }}>Launch Simulator #{item.num}</button>
                  </div>
                ))}
              </div>
            </main>
          )}

          {activeNav === 'admin' && currentUser?.isSuperuser && currentUser?.username === 'Dhruv1706' && (
            <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
              <div className="rounded-3xl border border-cyan-400/40 p-6 flex flex-wrap items-center justify-between gap-4 shadow-2xl" style={{ backgroundColor: '#15171A' }}>
                <div className="space-y-1">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/15 text-cyan-300 text-xs font-mono"><Shield className="w-3.5 h-3.5" /> PRIVATE SUPERUSER CONSOLE • EXCLUSIVE TO DHRUV1706</div>
                  <h1 className="text-2xl font-black text-white">Registered Users Directory ({registeredUsers.length} Real Sign-Ups)</h1>
                  <p className="text-xs text-slate-400">Only real users who register on the launch portal appear here.</p>
                </div>
                <div className="flex flex-wrap items-center gap-2.5">
                  <button onClick={() => setShowAllPasswords((prev) => !prev)} className="flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-xs font-bold border border-cyan-400/40 bg-cyan-500/10 text-cyan-300">{showAllPasswords ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}{showAllPasswords ? 'Mask Passwords' : 'Reveal All Passwords'}</button>
                  <button onClick={handleExportRegisteredUsersCsv} disabled={registeredUsers.length === 0} className="flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-xs font-bold text-slate-950 disabled:opacity-40" style={{ backgroundImage: 'linear-gradient(90deg, #00FFFF 0%, #10D582 100%)' }}>Export CSV ({registeredUsers.length})</button>
                </div>
              </div>
              <div className="rounded-2xl border border-white/10 p-4 flex items-center gap-3" style={{ backgroundColor: '#15171A' }}>
                <Search className="w-4 h-4 text-slate-400" />
                <input type="text" value={adminSearchQuery} onChange={(e) => setAdminSearchQuery(e.target.value)} placeholder="Filter registered users by name, username, email, or language..." className="w-full bg-transparent text-xs sm:text-sm text-white placeholder:text-slate-500 focus:outline-none" />
              </div>
              <div className="rounded-2xl border border-white/10 overflow-hidden shadow-xl" style={{ backgroundColor: '#15171A' }}>
                {registeredUsers.length === 0 ? (
                  <div className="p-12 text-center space-y-2">
                    <Users className="w-8 h-8 text-cyan-400 mx-auto opacity-80" />
                    <div className="text-sm font-bold text-white">No External Users Have Registered Yet</div>
                    <p className="text-xs text-slate-400 max-w-md mx-auto">All pre-seeded dummy users have been removed. Whenever someone completes the Sign Up form, their Name, Email, Password, Preferred Language, and Score will appear here.</p>
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr className="border-b border-white/10 bg-black/40 text-slate-400 font-mono uppercase">
                          <th className="py-3.5 px-4">Registered At</th><th className="py-3.5 px-4">Full Name & Username</th><th className="py-3.5 px-4">Email</th><th className="py-3.5 px-4">Password</th><th className="py-3.5 px-4">Language</th><th className="py-3.5 px-4">Diagnostic & Weakness</th><th className="py-3.5 px-4 text-right">Revoke</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/5">
                        {registeredUsers.filter((u) => {
                          if (!adminSearchQuery.trim()) return true;
                          const q = adminSearchQuery.toLowerCase();
                          return (u.name || '').toLowerCase().includes(q) || (u.username || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q) || (u.preferredLanguage || '').toLowerCase().includes(q);
                        }).map((u) => {
                          const isVisible = showAllPasswords || revealedUserIds[u.id];
                          return (
                            <tr key={u.id} className="hover:bg-white/5">
                              <td className="py-3.5 px-4 font-mono text-slate-400">{u.registeredAt || 'Just now'}</td>
                              <td className="py-3.5 px-4"><div className="font-bold text-white">{u.name}</div><div className="font-mono text-slate-400">@{u.username}</div></td>
                              <td className="py-3.5 px-4 font-mono text-slate-200">{u.email}</td>
                              <td className="py-3.5 px-4">
                                <div className="inline-flex items-center gap-2 px-2.5 py-1 rounded-lg bg-black/50 border border-white/10 font-mono">
                                  <span className="text-emerald-300 font-bold">{isVisible ? u.password : '••••••••••••'}</span>
                                  <button onClick={() => setRevealedUserIds((p) => ({ ...p, [u.id]: !p[u.id] }))} className="text-slate-400 hover:text-white" title="Toggle">{isVisible ? <EyeOff className="w-3.5 h-3.5" /> : <Eye className="w-3.5 h-3.5" />}</button>
                                  <button onClick={() => { navigator.clipboard?.writeText(u.password); setCopiedId(u.id); setTimeout(() => setCopiedId(null), 1500); }} className="text-slate-400 hover:text-cyan-300">{copiedId === u.id ? <Check className="w-3.5 h-3.5 text-emerald-400" /> : <Copy className="w-3.5 h-3.5" />}</button>
                                </div>
                              </td>
                              <td className="py-3.5 px-4 font-mono text-cyan-300">{u.preferredLanguage || 'Not Decided Yet'}</td>
                              <td className="py-3.5 px-4"><div className="font-bold text-emerald-300">{u.diagnosticScore}</div><div className="text-[11px] text-slate-400">{u.weaknessTag}</div></td>
                              <td className="py-3.5 px-4 text-right"><button onClick={() => handleDeleteRegisteredUser(u.id)} className="p-1.5 rounded-lg bg-rose-500/15 text-rose-300 hover:bg-rose-500/30" title="Delete"><Trash2 className="w-4 h-4" /></button></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
